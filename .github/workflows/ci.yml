name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ═══════════════════════════════════════════════════════════
  # Job 1: Backend test
  # ═══════════════════════════════════════════════════════════
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # ═══════════════════════════════════════════════════════════
  # Job 2: Frontend build
  # ═══════════════════════════════════════════════════════════
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci 2>/dev/null || npm install

      - name: Build
        run: |
          cd frontend
          npm run build

  # ═══════════════════════════════════════════════════════════
  # Job 3: Docker image build
  # ═══════════════════════════════════════════════════════════
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.ci
          push: false
          load: true
          tags: pythonai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: pythonai-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test backend
        run: |
          docker run -d --name test-backend -p 8000:8000 \
            -e AI_PROVIDER=mock \
            -e STT_PROVIDER=mock \
            -e TTS_PROVIDER=mock \
            pythonai-backend:latest
          sleep 10
          curl -f http://localhost:8000/health || (docker logs test-backend && exit 1)
          docker stop test-backend

  # ═══════════════════════════════════════════════════════════
  # Job 4: Push to registry (only on push to main)
  # ═══════════════════════════════════════════════════════════
  push-registry:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Uncomment and configure when you have a registry:
    # steps:
