    #       password: ${{ secrets.DOCKER_TOKEN }}
    #
    #   - name: Build and push
    #     uses: docker/build-push-action@v6
    #     with:
    #       context: ./backend
    #       push: true
    #       tags: your-registry/neusoft-backend:latest
    steps:
      - name: Registry push (skipped — configure secrets to enable)
        run: echo "镜像推送已就绪。配置 DOCKER_USERNAME + DOCKER_TOKEN secrets 后自动启用。"
